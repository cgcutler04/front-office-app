<title>Front Office</title>
<style>
html,body{height:100%;margin:0;background:radial-gradient(120% 90% at 50% 0%,#111B33 0%,#0A0E17 45%,#07090F 100%);color:#E6ECF7;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.box{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transform:translateY(-5vh)}
img{width:112px;height:112px;filter:drop-shadow(0 14px 44px rgba(108,155,255,.45))}

.s{font-weight:500;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6B7A94}

a{color:#9AA7BF;font-size:11.5px;text-decoration:none}
